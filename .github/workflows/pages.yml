# 정적 앱을 GitHub Pages로 배포한다.
# HTTPS라서 모바일 브라우저에서도 웹캠 사용이 가능하다.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/eye-tracking-korean-communication-ffc7c8
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
