<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>손끝으로 — 터치 한국어 의사소통</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%86%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 메인 의사소통 화면 -->
  <section id="screen-main" class="screen active">
    <div class="sentence-bar">
      <div id="sentence"><span class="cursor"></span></div>
      <div class="sentence-hint" id="mode-hint"></div>
    </div>
    <div class="bands">
      <div id="band-top" class="band band-top" role="button" tabindex="0">
        <div class="band-cue">👆 여기를 눌러 선택</div>
      </div>
      <div id="band-bottom" class="band band-bottom" role="button" tabindex="0">
        <div class="band-cue">👆 여기를 눌러 선택</div>
      </div>
      <button id="btn-delete" class="delete-bar">⌫ 삭제 · 뒤로</button>
    </div>
    <div class="statusbar">
      <span class="app-name">👆 손끝으로</span>
      <span class="spacer"></span>
      <span class="sub" style="font-size:15px">원하는 글자가 있는 칸을 누르면 절반씩 줄어들어요</span>
      <button id="btn-settings" class="gear-btn" title="설정">⚙️</button>
    </div>
  </section>

  <!-- 선택 에코 -->
  <div id="echo"><div class="echo-text"></div></div>

  <!-- 말하는 중 오버레이 -->
  <div id="overlay-speaking" class="overlay">
    <h2>🔊 말하는 중…</h2>
    <p class="sub" id="speaking-text"></p>
  </div>

  <!-- 설정 -->
  <div id="settings">
    <div class="settings-panel">
      <h2>설정</h2>
      <div class="settings-row">
        <span>말 속도</span>
        <span><input type="range" id="set-rate" min="0.6" max="1.4" step="0.05" />
          <span id="set-rate-val"></span></span>
      </div>
      <div class="settings-row">
        <span>학습된 단어 데이터</span>
        <span>
          <button id="btn-export">내보내기</button>
          <button id="btn-import">가져오기</button>
          <input type="file" id="import-file" accept=".json" style="display:none" />
        </span>
      </div>
      <div class="settings-row">
        <span>닫기</span>
        <button id="btn-close-settings" class="primary">확인</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
